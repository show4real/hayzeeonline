; Overrides the packaged pool. Loaded after www.conf, hence the zz- prefix.
[www]
; Log to the container's stderr so `docker logs` shows worker output.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Used by the container healthcheck.
ping.path = /ping
ping.response = pong

; dynamic sizes the pool to load. Tune pm.max_children to the box:
; roughly (available RAM for PHP) / (average request memory).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
; Recycle workers periodically so a slow leak cannot accumulate.
pm.max_requests = 500

; A request stuck beyond this is killed and logged with a backtrace.
request_terminate_timeout = 120s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

clear_env = no
