; Production PHP settings, mounted at /usr/local/etc/php/conf.d/99-app.ini

; Product photo uploads are rotated and recompressed in memory by Intervention
; Image, which needs room for the decoded bitmap, not just the file.
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 30

; Never render a stack trace to the client; Laravel handles reporting and the
; logs are the place for detail.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container — a new release is a new
; image — so opcache never needs to stat files for changes.
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
