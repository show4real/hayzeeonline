# The stack sits behind a reverse proxy that terminates TLS, so this server
# speaks plain HTTP and takes the client's real address and scheme from the
# headers that proxy sets.

# Trust the proxy for X-Forwarded-For. Docker bridge networks are RFC1918, and
# the port is bound to localhost, so nothing else can reach this.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# NOTE: deliberately not an `upstream` block. nginx resolves the names in one
# of those exactly once, at startup, and caches the address for ever — so the
# first deploy that replaces the app container leaves nginx talking to an IP
# that no longer exists and every request 502s until nginx is restarted too.
#
# Resolving through Docker's embedded DNS at request time instead means a
# replaced app container is picked up within `valid`.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    charset utf-8;
    # Must stay >= post_max_size in docker/php/php.ini, or a large multi-image
    # product upload is rejected by nginx before PHP ever sees it.
    client_max_body_size 72M;

    # Container-level check, answered by nginx alone. Laravel's own /up still
    # exercises the PHP path.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Catalogue imagery. The controllers write these into the web root rather
    # than to a Laravel disk, so they are served from volumes mounted here —
    # never through PHP.
    #
    # The CORS header is set here as well as in config/cors.php, because a
    # static file never reaches Laravel and so never passes HandleCors; the
    # storefront fetches these cross-origin.
    location ~* ^/(images|detailedproducts|health_supplements)/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        access_log off;
        try_files $uri =404;
    }

    # Customer documents: ID cards, previous-insurance PDFs, signature images,
    # quick-form uploads.
    #
    # Served, because the application stores absolute URL::asset() URLs for
    # them and the admin UI loads them by that URL — but deliberately NOT like
    # the catalogue above:
    #
    #   * no wildcard CORS. Nothing fetches these cross-origin, and these are
    #     identity documents.
    #   * no shared caching, so a proxy between here and the admin does not
    #     keep a copy of someone's passport.
    #   * noindex, because the web root is crawlable and the filenames are
    #     only semi-random (timestamp + 8 chars).
    #
    # NOTE: these URLs are unauthenticated — anyone holding one can fetch it.
    # That is how the application was built; moving them behind a signed route
    # or onto a private disk is an application change, not an nginx one.
    location ~* ^/(insurance|client_consents|quick_forms)/ {
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Uploads written through a Laravel disk, via the public/storage symlink.
    location ^~ /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php is ever executed. Anything else ending in .php is a
    # probe, not a route.
    location ~ ^/index\.php(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Laravel reads these to rebuild the original URL behind the proxy.
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    # Never serve the things that should not be reachable even if they end up
    # under the web root by accident.
    location ~ /\.(?!well-known) { deny all; }

    # NOTE: `json` is deliberately absent from this list. GET /api/openapi.json
    # is a real route (AiAgentController@openapi) that publishes the catalogue
    # spec to ChatGPT Actions — a blanket deny on the extension returns 403 for
    # it, and the connector then reports the API as unreachable. The manifests
    # that actually matter are denied by name below.
    location ~* \.(env|sql|sqlite|log|ini|sh|bak|lock|ya?ml)$ { deny all; }

    # Extensionless or named leftovers that must never be served — a committed
    # error_log in the web root would otherwise be fetchable.
    location ~* ^/(error_log|web\.config|composer\.(json|lock)|package(-lock)?\.json)$ { deny all; }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/javascript application/xml
               text/css text/plain text/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
