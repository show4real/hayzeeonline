# LOCAL DEVELOPMENT ONLY — production is docker/nginx/default.conf.
#
# Deliberately permissive: no deny rules, no proxy/real_ip handling, and the
# app is read from the bind mount rather than baked into the image.

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    # Keep >= post_max_size in the PHP image's 99-local.ini.
    client_max_body_size 72M;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded product images are served as static files, bypassing Laravel,
    # so the CORS header has to be added here for a cross-origin fetch() from
    # the frontend dev server.
    location ~* ^/(images|detailedproducts)/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # No timeout worth speaking of, so xdebug / a long artisan call in a
        # request does not get cut off mid-debug.
        fastcgi_read_timeout 600s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
